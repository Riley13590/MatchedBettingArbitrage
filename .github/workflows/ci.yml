name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketedge
          POSTGRES_PASSWORD: marketedge
          POSTGRES_DB: marketedge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketedge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://marketedge:marketedge@localhost:5432/marketedge
      REDIS_URL: redis://localhost:6379/0
      APP_MODE: PAPER
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Typecheck (mypy)
        run: mypy marketedge apps/api
      - name: Migrate
        run: alembic -c marketedge/storage/migrations/alembic.ini upgrade head
      - name: Test
        run: pytest --cov -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: go vet (windows target)
        run: cd launcher && GOOS=windows GOARCH=amd64 go vet .
      - name: Build MarketEdge.exe
        run: make launcher
      - name: Verify PE binary produced
        run: file MarketEdge.exe | grep -q "PE32+ executable"
